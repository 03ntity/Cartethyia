services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartethyia:local
    ports:
      - "${PORT:-12800}:12800"
    # .env supplies the app's own secrets, but Redis location is set below so it
    # overrides that file. Inside the Compose network the app reaches Redis by
    # service name. The interpolation deliberately does not read the host
    # REDIS_URL: environment overrides env_file, so a host-run bun dev value
    # such as redis://localhost:6379 would otherwise enter the container.
    env_file:
      - "${CARTETHYIA_ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      PORT: "12800"
      DASHBOARD_DIST: /app/dist/dashboard
      CARTETHYIA_DATA_DIR: /app/data
      CARTETHYIA_DB_MODE: ${CARTETHYIA_DB_MODE:-full}
      REDIS_URL: ${CARTETHYIA_REDIS_URL-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      # Lite database, install id, and payload captures live under /app/data;
      # without this mount a container replace wipes them.
      - cartethyia-data:/app/data
    restart: unless-stopped
    networks:
      - cartethyia

  # Redis is bundled for Docker's default full capabilities. Set
  # CARTETHYIA_REDIS_URL empty for the in-memory backend. PostgreSQL is never
  # bundled; full mode reaches it through DATABASE_URL in .env.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cartethyia

  # Optional PgBouncer for full mode — the only pooler this stack standardizes
  # on. PostgreSQL is never bundled, so a full-mode operator points DATABASE_URL
  # at their own server; starting `docker compose --profile full up` places a
  # transaction-mode PgBouncer in front of it instead. The values mirror the
  # audited 1-2 GB VPS reference: the server pool caps at 12 — more than a
  # 1-vCPU box can use, and a hard ceiling on idle/peak backend RAM. Point the
  # app's DATABASE_URL at pgbouncer:6432 (credentials must equal DB_USER /
  # DB_PASSWORD below; the image derives its userlist from them). Without the
  # profile nothing changes: `docker compose up` starts only app and redis.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    environment:
      DB_HOST: ${PGBOUNCER_DB_HOST:?set PGBOUNCER_DB_HOST in .env to your PostgreSQL host}
      DB_PORT: ${PGBOUNCER_DB_PORT:-5432}
      DB_NAME: ${PGBOUNCER_DB_NAME:-cartethyia}
      DB_USER: ${PGBOUNCER_DB_USER:?set PGBOUNCER_DB_USER in .env to the PostgreSQL role}
      DB_PASSWORD: ${PGBOUNCER_DB_PASSWORD:?set PGBOUNCER_DB_PASSWORD in .env}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "12"
      MIN_POOL_SIZE: "2"
      RESERVE_POOL_SIZE: "5"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cartethyia

volumes:
  redisdata:
  cartethyia-data:

networks:
  cartethyia:
    driver: bridge
